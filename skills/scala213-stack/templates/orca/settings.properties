# .orca/settings.properties: committed with the project.
# Pinned sbt gates (stops Orca's auto-discovery from guessing).
#   format: runs before each review round
#   lint:   type-checks main + test sources WITHOUT running tests; runs next to reviewers
#   test:   NOT run by the review loop; flows must run it in their own stage
# For large builds, keep an sbt server running and prefix with `sbt --client`.
format = sbt scalafmtAll scalafmtSbt
lint = sbt Test/compile
test = sbt test

# Agent roles (harness[:model]). Uncomment to pin; default is claude without a model pin.
# planningAgent = claude:opus
# codingAgent = claude:sonnet
# reviewAgent = claude:sonnet
